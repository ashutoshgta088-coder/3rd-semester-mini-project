<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stuatten — Bluetooth-Based Smart Attendance System</title>
    <!-- Apply saved theme immediately to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('stuatten_theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
